[project]
name = "robofleet-nexus"
version = "0.1.0"
description = "Production-style robotics orchestration layer for ROS2, NVIDIA Isaac workflows, telemetry, diagnostics, and auditability."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Amit Brahmbhatt" }
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "typer",
  "rich",
  "httpx"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy"
]

[project.scripts]
robofleet = "robofleet_nexus.cli.main:app"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
