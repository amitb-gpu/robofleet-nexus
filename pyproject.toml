[project]
name = "robofleet-nexus"
version = "0.1.0"
description = "Production-style robotics orchestration layer for ROS2, NVIDIA Isaac workflows, telemetry, diagnostics, and auditability."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Amit Brahmbhatt" }
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "typer",
  "rich",
  "httpx",
  "PyYAML",
  "anthropic",
  "websockets",
  "pyarrow",
  "pandas"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-PyYAML"
]

[project.scripts]
robofleet = "robofleet_nexus.cli.main:app"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
  "robofleet_nexus.diagnostics.rules",
  "robofleet_nexus.core.gpu_monitor",
  "robofleet_nexus.rca.agent",
  "robofleet_nexus.api.ws_routes",
  "robofleet_nexus.api.main",
  "robofleet_nexus.adapters.ros2_bridge",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "rclpy.*",
  "sensor_msgs.*",
  "diagnostic_msgs.*",
  "nav_msgs.*",
  "launch.*",
  "launch_testing.*",
]
ignore_missing_imports = true
