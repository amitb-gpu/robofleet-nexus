[project]
name = "robofleet-nexus"
version = "0.1.0"
description = "Production-style robotics orchestration layer for ROS2, NVIDIA Isaac workflows, telemetry, diagnostics, and auditability."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Amit Brahmbhatt" }
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "typer",
  "rich",
  "httpx",
  "PyYAML",
  "anthropic",
  "websockets",
  "pyarrow",
  "pandas"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-PyYAML",
  "pandas-stubs"
]

[project.scripts]
robofleet = "robofleet_nexus.cli.main:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit rule set so CI results don't change when a new ruff release widens its defaults.
select = ["E", "F", "W", "I", "UP"]
# str+Enum is kept deliberately: StrEnum changes str() output that payloads rely on.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Aligned demo data tables read better unwrapped.
"src/robofleet_nexus/adapters/demo_fleet.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
  "robofleet_nexus.diagnostics.rules",
  "robofleet_nexus.core.gpu_monitor",
  "robofleet_nexus.rca.agent",
  "robofleet_nexus.api.ws_routes",
  "robofleet_nexus.api.main",
  "robofleet_nexus.adapters.ros2_bridge",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "rclpy.*",
  "sensor_msgs.*",
  "diagnostic_msgs.*",
  "nav_msgs.*",
  "launch.*",
  "launch_testing.*",
  "std_msgs.*",
  "pyarrow.*",
]
ignore_missing_imports = true
